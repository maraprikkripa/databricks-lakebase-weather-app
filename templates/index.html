<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Intelligence</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated celestial background */
        .celestial {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .sun, .moon {
            position: absolute;
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        .sun {
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, #ffd700 0%, #ff8c00 100%);
            box-shadow: 0 0 60px #ffd700, 0 0 100px #ff8c00;
            top: 10%;
            right: 15%;
            animation: float 6s ease-in-out infinite, sunGlow 3s ease-in-out infinite;
        }

        @keyframes sunGlow {
            0%, 100% {
                box-shadow: 0 0 60px #ffd700, 0 0 100px #ff8c00;
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 120px #ffd700, 0 0 180px #ff8c00, 0 0 220px rgba(255, 215, 0, 0.4);
                transform: scale(1.05);
            }
        }

        .moon {
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, #f0f0f0 0%, #c0c0c0 100%);
            box-shadow: 0 0 40px #fff;
            top: 60%;
            left: 10%;
            animation-delay: 3s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        /* Stars */
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Rain effect */
        .rain {
            position: absolute;
            width: 2px;
            height: 40px;
            background: linear-gradient(to bottom, transparent, rgba(173, 216, 230, 0.6));
            animation: rainfall 1s linear infinite;
        }

        @keyframes rainfall {
            0% {
                transform: translateY(-100px);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(100vh);
                opacity: 0;
            }
        }

        /* Storm cloud */
        .cloud {
            position: absolute;
            background: rgba(100, 100, 120, 0.7);
            border-radius: 100px;
            animation: cloudFloat 20s linear infinite;
        }

        .cloud::before,
        .cloud::after {
            content: '';
            position: absolute;
            background: rgba(100, 100, 120, 0.7);
            border-radius: 100px;
        }

        @keyframes cloudFloat {
            0% {
                transform: translateX(-200px);
            }
            100% {
                transform: translateX(calc(100vw + 200px));
            }
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, #ffd700, #ff8c00, #f0f0f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #999;
            letter-spacing: 1px;
        }

        .search-container {
            background: rgba(30, 30, 50, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .search-box {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        input[type="text"] {
            flex: 1;
            padding: 1rem 1.5rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: #e0e0e0;
            font-size: 1rem;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }

        input[type="text"]::placeholder {
            color: #666;
        }

        button {
            padding: 1rem 2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .options {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .option-group {
            flex: 1;
            min-width: 200px;
        }

        .option-group label {
            display: block;
            font-size: 0.85rem;
            color: #999;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        select {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .results {
            background: rgba(30, 30, 50, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: none;
        }

        .results.show {
            display: block;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .result-count {
            font-size: 0.9rem;
            color: #999;
        }

        .search-level-badge {
            padding: 0.4rem 1rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .summary {
            background: rgba(255, 215, 0, 0.1);
            border-left: 4px solid #ffd700;
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .summary-label {
            font-size: 0.75rem;
            color: #ffd700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .result-item {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .result-item:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 215, 0, 0.3);
        }

        .result-meta {
            display: flex;
            gap: 1rem;
            margin-bottom: 0.75rem;
            flex-wrap: wrap;
        }

        .badge {
            padding: 0.3rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .badge-alert {
            background: rgba(255, 69, 0, 0.2);
            color: #ff6347;
            border: 1px solid rgba(255, 69, 0, 0.3);
            position: relative;
            padding-left: 2rem;
        }

        .badge-alert::before {
            content: '⚡';
            position: absolute;
            left: 0.5rem;
            font-size: 1rem;
            animation: flash 2s infinite;
        }

        @keyframes flash {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0.3; }
        }

        .badge-forecast {
            background: rgba(100, 149, 237, 0.2);
            color: #87ceeb;
            border: 1px solid rgba(100, 149, 237, 0.3);
            position: relative;
            padding-left: 2rem;
        }

        .badge-forecast::before {
            content: '☀️';
            position: absolute;
            left: 0.5rem;
            font-size: 1rem;
        }

        /* Weather-specific alert badges */
        .badge-flood {
            background: rgba(30, 144, 255, 0.2);
            color: #4169e1;
            border: 1px solid rgba(30, 144, 255, 0.3);
            position: relative;
            padding-left: 2rem;
        }

        .badge-flood::before {
            content: '🌊';
            position: absolute;
            left: 0.5rem;
            font-size: 1rem;
            animation: wave 2s ease-in-out infinite;
        }

        @keyframes wave {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-3px); }
        }

        .badge-thunderstorm {
            background: rgba(138, 43, 226, 0.2);
            color: #9370db;
            border: 1px solid rgba(138, 43, 226, 0.3);
            position: relative;
            padding-left: 2rem;
        }

        .badge-thunderstorm::before {
            content: '⛈️';
            position: absolute;
            left: 0.5rem;
            font-size: 1rem;
            animation: shake 3s ease-in-out infinite;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-2px); }
            20%, 40%, 60%, 80% { transform: translateX(2px); }
        }

        .badge-heat {
            background: rgba(255, 140, 0, 0.2);
            color: #ff8c00;
            border: 1px solid rgba(255, 140, 0, 0.3);
            position: relative;
            padding-left: 2rem;
        }

        .badge-heat::before {
            content: '🔥';
            position: absolute;
            left: 0.5rem;
            font-size: 1rem;
            animation: heatPulse 2s ease-in-out infinite;
        }

        @keyframes heatPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        }

        .badge-similarity {
            background: rgba(0, 255, 127, 0.2);
            color: #7fff00;
            border: 1px solid rgba(0, 255, 127, 0.3);
        }

        .result-headline {
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: #ffd700;
        }

        .result-location {
            font-size: 0.85rem;
            color: #999;
            margin-bottom: 0.75rem;
        }

        .result-text {
            line-height: 1.6;
            color: #ccc;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: #999;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #ffd700;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: rgba(255, 69, 0, 0.2);
            border-left: 4px solid #ff4500;
            padding: 1.5rem;
            border-radius: 8px;
            color: #ff6347;
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            h1 {
                font-size: 2rem;
            }

            .search-box {
                flex-direction: column;
            }

            .options {
                flex-direction: column;
                gap: 1rem;
            }

            .sun {
                width: 80px;
                height: 80px;
                top: 5%;
                right: 5%;
            }

            .moon {
                width: 70px;
                height: 70px;
                top: 70%;
                left: 5%;
            }
        }
    </style>
</head>
<body>
    <!-- Celestial background -->
    <div class="celestial">
        <div class="sun"></div>
        <div class="moon"></div>
        <!-- Generate stars -->
        <script>
            const celestial = document.querySelector('.celestial');
            
            // Generate stars
            for (let i = 0; i < 50; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                celestial.appendChild(star);
            }

            // Generate rain drops (subtle, ambient effect)
            for (let i = 0; i < 30; i++) {
                const rain = document.createElement('div');
                rain.className = 'rain';
                rain.style.left = Math.random() * 100 + '%';
                rain.style.animationDelay = Math.random() * 2 + 's';
                rain.style.animationDuration = (0.5 + Math.random() * 0.5) + 's';
                celestial.appendChild(rain);
            }

            // Generate a few floating clouds
            for (let i = 0; i < 3; i++) {
                const cloud = document.createElement('div');
                cloud.className = 'cloud';
                const size = 60 + Math.random() * 40;
                cloud.style.width = size + 'px';
                cloud.style.height = size * 0.5 + 'px';
                cloud.style.top = (10 + i * 20) + '%';
                cloud.style.left = '-200px';
                cloud.style.animationDelay = (i * 7) + 's';
                cloud.style.animationDuration = (15 + Math.random() * 10) + 's';
                
                // Create cloud puffs
                const before = document.createElement('div');
                before.style.cssText = `width: ${size * 0.7}px; height: ${size * 0.5}px; top: -${size * 0.2}px; left: ${size * 0.2}px; position: absolute; background: rgba(100, 100, 120, 0.7); border-radius: 100px;`;
                const after = document.createElement('div');
                after.style.cssText = `width: ${size * 0.6}px; height: ${size * 0.4}px; top: -${size * 0.15}px; right: ${size * 0.1}px; position: absolute; background: rgba(100, 100, 120, 0.7); border-radius: 100px;`;
                
                cloud.appendChild(before);
                cloud.appendChild(after);
                celestial.appendChild(cloud);
            }
        </script>
    </div>

    <div class="container">
        <header>
            <h1>Weather Intelligence</h1>
            <p class="subtitle">AI-Powered Weather Search with Vector Embeddings</p>
        </header>

        <div class="search-container">
            <div class="search-box">
                <input
                    type="text"
                    id="query"
                    placeholder="Ask about weather... (e.g., 'Is there flooding in Illinois?')"
                    value="Is there flooding?"
                >
                <button onclick="search()">Search</button>
            </div>

            <div class="options">
                <div class="option-group">
                    <label>Search Mode</label>
                    <select id="searchMode">
                        <option value="rag">RAG (with AI summary)</option>
                        <option value="vector">Vector Search Only</option>
                    </select>
                </div>

                <div class="option-group">
                    <label>Search Level</label>
                    <select id="searchLevel">
                        <option value="document">Document-level</option>
                        <option value="chunk">Chunk-level</option>
                    </select>
                </div>

                <div class="option-group">
                    <label>Source Type</label>
                    <select id="sourceType">
                        <option value="">All</option>
                        <option value="alert">Alerts Only</option>
                        <option value="forecast">Forecasts Only</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="results" id="results">
            <!-- Results will be inserted here -->
        </div>
    </div>

    <script>
        async function search() {
            const query = document.getElementById('query').value.trim();
            const searchMode = document.getElementById('searchMode').value;
            const searchLevel = document.getElementById('searchLevel').value;
            const sourceType = document.getElementById('sourceType').value;
            const resultsDiv = document.getElementById('results');

            if (!query) {
                alert('Please enter a search query');
                return;
            }

            // Show loading
            resultsDiv.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Searching weather data...</p>
                </div>
            `;
            resultsDiv.classList.add('show');

            try {
                let response;

                if (searchMode === 'rag') {
                    // RAG mode: GET request
                    const params = new URLSearchParams({
                        query: query,
                        search_level: searchLevel,
                        top_k: 5
                    });
                    if (sourceType) params.append('source_type', sourceType);

                    response = await fetch(`/weather/search?${params.toString()}`);
                } else {
                    // Vector search mode: POST request
                    response = await fetch('/weather/search', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            query: query,
                            search_level: searchLevel,
                            source_type: sourceType || undefined,
                            top_k: 10
                        })
                    });
                }

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Search failed');
                }

                displayResults(data, searchMode);

            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="error">
                        <strong>Error:</strong> ${error.message}
                    </div>
                `;
            }
        }

        function displayResults(data, searchMode) {
            const resultsDiv = document.getElementById('results');
            let html = '';

            // Header
            html += `
                <div class="result-header">
                    <div class="result-count">
                        ${(data.results || []).length} results for "${data.query}"
                    </div>
                    <div class="search-level-badge">
                        ${data.search_level || 'chunk'} level
                    </div>
                </div>
            `;

            // Summary (RAG mode only)
            if (searchMode === 'rag' && data.summary) {
                html += `
                    <div class="summary">
                        <div class="summary-label">AI Summary (${data.llm_type || 'LLM'})</div>
                        <div>${data.summary}</div>
                    </div>
                `;
            }

            // Results
            if (data.results && data.results.length > 0) {
                data.results.forEach(result => {
                    // Detect specific weather alert types from headline
                    let sourceTypeBadge = 'badge-forecast';
                    if (result.source_type === 'alert') {
                        const headline = (result.headline || '').toLowerCase();
                        if (headline.includes('flood') || headline.includes('flash flood')) {
                            sourceTypeBadge = 'badge-flood';
                        } else if (headline.includes('thunderstorm') || headline.includes('severe thunderstorm') || headline.includes('storm')) {
                            sourceTypeBadge = 'badge-thunderstorm';
                        } else if (headline.includes('heat') || headline.includes('excessive heat')) {
                            sourceTypeBadge = 'badge-heat';
                        } else {
                            sourceTypeBadge = 'badge-alert';
                        }
                    }

                    const similarity = (result.similarity * 100).toFixed(0);

                    const text = result.chunk_text || result.narrative_text || '';

                    html += `
                        <div class="result-item">
                            <div class="result-meta">
                                <span class="badge ${sourceTypeBadge}">
                                    ${result.source_type}
                                </span>
                                <span class="badge badge-similarity">
                                    ${similarity}% match
                                </span>
                            </div>
                            <div class="result-headline">${result.headline}</div>
                            <div class="result-location">📍 ${result.location}</div>
                            <div class="result-text">${text.substring(0, 300)}${text.length > 300 ? '...' : ''}</div>
                        </div>
                    `;
                });
            } else {
                html += '<div class="loading"><p>No results found.</p></div>';
            }

            resultsDiv.innerHTML = html;
        }

        // Allow Enter key to search
        document.getElementById('query').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                search();
            }
        });
    </script>
</body>
</html>
